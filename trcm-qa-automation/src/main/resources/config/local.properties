# ============================================================
# LOCAL environment: everything runs against the built-in mock server.
# Run with: mvn test -Denv=local   (this is the default)
# Any key can be overridden with -Dkey=value or an environment variable
# (dots become underscores, upper case: apim.subscription.key -> APIM_SUBSCRIPTION_KEY)
# ============================================================
env.name=local
mock.server.enabled=true
mock.server.port=8089

app.url=http://localhost:8089/app/batch-review.html
apim.base.url=http://localhost:8089/apim
service.base.url=http://localhost:8089/service
admin.base.url=http://localhost:8089/admin

# Fake keys. In CI these come from secret variables / Jenkins credentials instead.
apim.subscription.key=fake-apim-subscription-key-123
service.api.key=fake-service-api-key-456

browser=chrome
headless=false
implicit.wait.seconds=0
explicit.wait.seconds=10
review.wait.seconds=30
retry.count=0
