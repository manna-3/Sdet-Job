# ============================================================
# DEV environment (FAKE URLs - for learning how env switching works).
# These hosts do not exist. Run with: mvn test -Denv=dev
# ============================================================
env.name=dev
mock.server.enabled=false

app.url=https://trcm-dev.fakehealthcare-demo.com/batch-review
apim.base.url=https://apim-trcm-dev.fakehealthcare-demo.net/coding-agent-api
service.base.url=https://trcm-coding-agent-dev.fakehealthcare-demo.net
admin.base.url=https://apim-trcm-dev.fakehealthcare-demo.net/admin

# Never commit real keys. CI injects APIM_SUBSCRIPTION_KEY and SERVICE_API_KEY.
apim.subscription.key=SET_IN_CI_SECRETS
service.api.key=SET_IN_CI_SECRETS

browser=chrome
headless=true
implicit.wait.seconds=0
explicit.wait.seconds=15
review.wait.seconds=90
retry.count=1
